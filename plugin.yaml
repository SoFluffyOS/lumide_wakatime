id: lumide_wakatime
name: 'WakaTime'
description: 'WakaTime time tracking for Lumide IDE'
entry_point: 'bin/main.dart'

activation_events:
  - 'onStartup'

permissions:
  - fileSystem:
      - '${workspace}/**'
      - '${home}/.wakatime/**'
  - shell:
      - 'wakatime-cli'
      - 'wakatime-cli-darwin-amd64'
      - 'wakatime-cli-darwin-arm64'
      - 'wakatime-cli-linux-amd64'
      - 'wakatime-cli-linux-arm64'
      - 'wakatime-cli-linux-386'
      - 'wakatime-cli-linux-arm'
      - 'wakatime-cli-windows-amd64'
      - 'wakatime-cli-windows-arm64'
      - 'wakatime-cli-windows-386'

configuration:
  - key: wakatime.statusBar
    type: boolean
    default: true
    title: 'Status Bar Activity'
    description: 'Whether to show today''s coding activity in the status bar'

contributes:
  commands:
    - id: wakatime.apiKey
      title: 'WakaTime: API Key'
      category: 'WakaTime'
